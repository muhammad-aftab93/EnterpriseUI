name: .NET Desktop CI & Release

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  CONFIGURATION: Release
  SOLUTION_FILE: EnterpriseUI.slnx
  WINFORMS_DEMO_PROJECT: samples/EnterpriseUI.WinFormsDemo/EnterpriseUI.WinFormsDemo.csproj

jobs:
  build-test-and-publish:
    name: Build, Test & Package (Windows Desktop)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 & 9.0 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          cache: true

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build EnterpriseUI Solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/EnterpriseUI.UnitTests/EnterpriseUI.UnitTests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Run Integration, Accessibility & UI Automation Tests
        run: |
          dotnet test tests/EnterpriseUI.IntegrationTests/EnterpriseUI.IntegrationTests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --logger "trx;LogFileName=integration-tests.trx" --results-directory TestResults
          dotnet test tests/EnterpriseUI.AccessibilityTests/EnterpriseUI.AccessibilityTests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --logger "trx;LogFileName=accessibility-tests.trx" --results-directory TestResults
          dotnet test tests/EnterpriseUI.UIAutomationTests/EnterpriseUI.UIAutomationTests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --logger "trx;LogFileName=uiautomation-tests.trx" --results-directory TestResults

      - name: Publish EnterpriseUI.WinFormsDemo (win-x64)
        run: dotnet publish ${{ env.WINFORMS_DEMO_PROJECT }} --configuration ${{ env.CONFIGURATION }} --runtime win-x64 --self-contained false -p:PublishSingleFile=false --output ${{ runner.temp }}/publish/EnterpriseUI.WinFormsDemo

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EnterpriseUI-TestResults
          path: TestResults/**/*.trx
          retention-days: 14

      - name: Upload WinFormsDemo Desktop Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnterpriseUI-WinFormsDemo-win-x64
          path: ${{ runner.temp }}/publish/EnterpriseUI.WinFormsDemo
          retention-days: 30

